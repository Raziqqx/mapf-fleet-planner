# Build, format check, the C++ tests under AddressSanitizer + UBSan, and the
# pybind11 smoke test. Only one small MovingAI map (room-32-32-4) is
# downloaded, and it is cached between runs; the full benchmark and profile
# are local-only (`make reproduce`) because they take ~15 min.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format-18 python3-dev python3-venv
          sudo ln -sf "$(command -v clang-format-18)" /usr/local/bin/clang-format

      - name: Format check
        run: make format-check

      - name: MovingAI data cache
        uses: actions/cache@v4
        with:
          path: data
          key: movingai-room-32-32-4-${{ hashFiles('scripts/download_movingai.sh') }}

      - name: Download one MovingAI map
        run: MAPF_MAPS=room-32-32-4 scripts/download_movingai.sh

      - name: Tests under ASan + UBSan
        run: make test

      - name: Python bindings smoke test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pybind11==2.13.6 pytest
          make pytest PYTHON=.venv/bin/python
          PYTHONPATH=build/release .venv/bin/python python/examples/plan_room.py room-32-32-4 1 20
